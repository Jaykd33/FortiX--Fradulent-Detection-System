[tool.poetry]
name = "fortix-backend"
version = "0.1.0"
description = "FortiX Fraud Detection Backend (FastAPI, SQLAlchemy 2.0 async, PostgreSQL)"
authors = ["FortiX Team <dev@fortix.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.112.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
alembic = "^1.13.1"
python-dotenv = "^1.0.1"
# ML and Data Science dependencies
pandas = "^2.1.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
joblib = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0"
ruff = "^0.5.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


